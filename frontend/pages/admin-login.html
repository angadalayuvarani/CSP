<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Login — AquaTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/index.html"><span class="drop"></span> AquaTrack</a>
  <nav><a href="/pages/login.html">Citizen login</a></nav>
</header>

<div class="shell-narrow">
  <div class="card auth-card">
    <div class="auth-logo"><span class="drop"></span></div>
    <h2 class="auth-title text-center">Water Department Login</h2>
    <p class="auth-sub">For Water Department / Municipal Corporation / Panchayat officials.</p>

    <div class="form-error" id="errBox"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Admin email</label>
        <input type="email" id="email" required placeholder="admin@aquatrack.gov.in">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-dark btn-block" id="submitBtn">Log in to Dashboard</button>
    </form>
    <p class="text-center small muted mt-16">
      Demo credentials — email <strong>admin@aquatrack.gov.in</strong>, password <strong>Admin@123</strong><br>
      (created by running <code>npm run seed</code> on the backend)
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("errBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      const data = await apiRequest("/auth/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        },
      });
      if (data.user.role !== "admin") {
        throw new Error("This account is not an admin account.");
      }
      Session.setAuth(data.token, data.user);
      window.location.href = "/pages/admin-dashboard.html";
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in to Dashboard";
    }
  });
</script>
</body>
</html>
