  <link rel="stylesheet" href="/css/style.css">

  <style>
    .database-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .database-toolbar select {
      min-width: 280px;
    }

    .database-search {
      min-width: 280px;
      padding: 11px 14px;
      border: 1px solid #dfe5e7;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: white;
    }

    .database-search:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .record-count {
      font-size: 0.9rem;
      color: #667;
      margin-left: auto;
    }

    .database-table-wrap {
      overflow-x: auto;
      background: white;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .database-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    .database-table th {
      background: #f4f7f8;
      padding: 13px;
      text-align: left;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .database-table td {
      padding: 12px;
      border-top: 1px solid #edf0f1;
      font-size: 0.85rem;
      vertical-align: top;
    }

    .database-table tr:hover {
      background: #fafcfc;
    }

    .null-value {
      color: #999;
      font-style: italic;
    }

    .loading {
      padding: 30px;
      text-align: center;
    }

    .no-results {
      padding: 40px;
      text-align: center;
      color: #777;
    }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pagination-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #dfe5e7;
      background: white;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s ease;
    }

    .pagination-btn:hover:not(:disabled) {
      background: #f1f5f9;
    }

    .pagination-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .pagination-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .pagination-info {
      text-align: center;
      margin-top: 10px;
      color: #667;
      font-size: 0.85rem;
    }

    /* Add Staff */

    .add-staff-box {
      display: none;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .add-staff-box h4 {
      margin: 0 0 16px;
      font-size: 1rem;
    }

    .staff-form-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .staff-input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1px solid #dfe5e7;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: white;
    }

    .staff-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .staff-form-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .staff-message {
      margin-top: 12px;
    }

    @media (max-width: 900px) {
      .staff-form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 768px) {

      .database-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .database-toolbar select,
      .database-search {
        width: 100%;
        min-width: 0;
      }

      .record-count {
        margin-left: 0;
      }

    }

    @media (max-width: 600px) {
      .staff-form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<body>

  <header class="topbar" id="topbar"></header>

  </div>

  <script src="/js/api.js"></script>

  <script>

    // ======================================================
    // Admin Protection
    // ======================================================

    Session.requireRole("admin");

    renderTopbar("topbar", {
      role: "admin"
    });


    // ======================================================
    // DOM Elements
    // ======================================================

    const tableSelect =
      document.getElementById("tableSelect");

    const searchInput =
      document.getElementById("searchInput");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const tableContainer =
      document.getElementById("tableContainer");

    const recordCount =
      document.getElementById("recordCount");

    const errorMessage =
      document.getElementById("errorMessage");

    const paginationContainer =
      document.getElementById("paginationContainer");

    const paginationInfo =
      document.getElementById("paginationInfo");

    const addStaffBox =
      document.getElementById("addStaffBox");

    const addStaffBtn =
      document.getElementById("addStaffBtn");

    const cancelStaffBtn =
      document.getElementById("cancelStaffBtn");

    const staffMessage =
      document.getElementById("staffMessage");


    // ======================================================
    // Database Data
    // ======================================================

    let currentRows = [];

    const rowsPerPage = 10;

    let currentPage = 1;

    let isSearchMode = false;

    let filteredRows = [];


    // ======================================================
    // Escape HTML
    // ======================================================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ======================================================
    // Format Database Value
    // ======================================================

    function formatValue(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return `
          <span class="null-value">
            NULL
          </span>
        `;

      }

      return escapeHtml(value);

    }


    // ======================================================
    // Load Table
    // ======================================================

    async function loadTable() {

      const table =
        tableSelect.value;


      searchInput.value = "";

      currentPage = 1;

      isSearchMode = false;

      filteredRows = [];


      // Show / hide Add Staff

      if (table === "staff") {

        addStaffBox.style.display = "block";

      } else {

        addStaffBox.style.display = "none";

      }


      tableContainer.innerHTML = `
        <div class="loading">
          Loading ${escapeHtml(table)}...
        </div>
      `;


      errorMessage.innerHTML = "";


      try {

        const data =
          await apiRequest(
            `/admin/database/${table}`
          );


        currentRows =
          Array.isArray(data.rows)
            ? data.rows
            : [];


        renderCurrentPage();


      } catch (err) {

        console.error(
          "Database viewer error:",
          err
        );


        recordCount.textContent = "";

        paginationContainer.innerHTML = "";

        paginationInfo.textContent = "";


        errorMessage.innerHTML = `
          <div
            class="form-error"
            style="
              display:block;
              margin-bottom:15px;
            "
          >
            ${escapeHtml(
              err.message ||
              "Unable to load database records."
            )}
          </div>
        `;


        tableContainer.innerHTML = "";

      }

    }


    // ======================================================
    // Render Current Page
    // ======================================================

    function renderCurrentPage() {

      if (!currentRows.length) {

        tableContainer.innerHTML = `
          <div class="no-results">
            No records found.
          </div>
        `;

        recordCount.textContent =
          "0 records";

        paginationContainer.innerHTML = "";

        paginationInfo.textContent = "";

        return;

      }


      const totalPages =
        Math.ceil(
          currentRows.length /
          rowsPerPage
        );


      if (currentPage > totalPages) {

        currentPage = totalPages;

      }


      const startIndex =
        (currentPage - 1) *
        rowsPerPage;


      const endIndex =
        startIndex +
        rowsPerPage;


      const pageRows =
        currentRows.slice(
          startIndex,
          endIndex
        );


      renderTable(pageRows);


      recordCount.textContent =
        `${currentRows.length} record${
          currentRows.length === 1
            ? ""
            : "s"
        }`;


      renderPagination(totalPages);


      const displayStart =
        startIndex + 1;

      const displayEnd =
        Math.min(
          endIndex,
          currentRows.length
        );


      paginationInfo.textContent =
        `Showing ${displayStart}–${displayEnd} of ${currentRows.length} records`;

    }


    // ======================================================
    // Render Table
    // ======================================================

    function renderTable(rows) {

      if (!rows.length) {

        tableContainer.innerHTML = `
          <div class="no-results">
            No records found.
          </div>
        `;

        return;

      }


      const columns =
        Object.keys(rows[0]);


      let html = `
        <table class="database-table">

          <thead>

            <tr>

              ${columns.map(column => `
                <th>
                  ${escapeHtml(column)}
                </th>
              `).join("")}

            </tr>

          </thead>

          <tbody>
      `;


      rows.forEach(row => {

        html += `
          <tr>
        `;


        columns.forEach(column => {

          html += `
            <td>
              ${formatValue(
                row[column]
              )}
            </td>
          `;

        });


        html += `
          </tr>
        `;

      });


      html += `
          </tbody>

        </table>
      `;


      tableContainer.innerHTML =
        html;

    }


    // ======================================================
    // Pagination
    // ======================================================

    function renderPagination(totalPages) {

      paginationContainer.innerHTML = "";


      if (totalPages <= 1) {

        return;

      }


      const previousBtn =
        document.createElement("button");

      previousBtn.className =
        "pagination-btn";

      previousBtn.textContent =
        "← Previous";

      previousBtn.disabled =
        currentPage === 1;


      previousBtn.addEventListener(
        "click",
        function () {

          if (currentPage > 1) {

            currentPage--;

            if (isSearchMode) {

              renderFilteredResults();

            } else {

              renderCurrentPage();

            }

          }

        }
      );


      paginationContainer.appendChild(
        previousBtn
      );


      for (
        let page = 1;
        page <= totalPages;
        page++
      ) {

        const pageBtn =
          document.createElement("button");


        pageBtn.className =
          "pagination-btn";


        pageBtn.textContent =
          page;


        if (page === currentPage) {

          pageBtn.classList.add(
            "active"
          );

        }


        pageBtn.addEventListener(
          "click",
          function () {

            currentPage = page;

            if (isSearchMode) {

              renderFilteredResults();

            } else {

              renderCurrentPage();

            }

          }
        );


        paginationContainer.appendChild(
          pageBtn
        );

      }


      const nextBtn =
        document.createElement("button");


      nextBtn.className =
        "pagination-btn";

      nextBtn.textContent =
        "Next →";

      nextBtn.disabled =
        currentPage === totalPages;


      nextBtn.addEventListener(
        "click",
        function () {

          if (
            currentPage <
            totalPages
          ) {

            currentPage++;

            if (isSearchMode) {

              renderFilteredResults();

            } else {

              renderCurrentPage();

            }

          }

        }
      );


      paginationContainer.appendChild(
        nextBtn
      );

    }


    // ======================================================
    // Search
    // ======================================================

    searchInput.addEventListener(
      "input",
      function () {

        const searchText =
          this.value
            .toLowerCase()
            .trim();


        if (!searchText) {

          isSearchMode = false;

          currentPage = 1;

          renderCurrentPage();

          return;

        }


        filteredRows =
          currentRows.filter(row => {

            return Object.values(row)
              .some(value => {

                return String(
                  value ?? ""
                )
                  .toLowerCase()
                  .includes(searchText);

              });

          });


        isSearchMode = true;

        currentPage = 1;

        renderFilteredResults();

      }
    );


    // ======================================================
    // Render Search Results
    // ======================================================

    function renderFilteredResults() {

      if (!filteredRows.length) {

        tableContainer.innerHTML = `
          <div class="no-results">
            No matching records found.
          </div>
        `;

        recordCount.textContent =
          "0 matching records";

        paginationContainer.innerHTML = "";

        paginationInfo.textContent = "";

        return;

      }


      const totalPages =
        Math.ceil(
          filteredRows.length /
          rowsPerPage
        );


      if (currentPage > totalPages) {

        currentPage = totalPages;

      }


      const startIndex =
        (currentPage - 1) *
        rowsPerPage;


      const endIndex =
        startIndex +
        rowsPerPage;


      const pageRows =
        filteredRows.slice(
          startIndex,
          endIndex
        );


      renderTable(pageRows);


      recordCount.textContent =
        `${filteredRows.length} matching record${
          filteredRows.length === 1
            ? ""
            : "s"
        }`;


      renderPagination(totalPages);


      const displayStart =
        startIndex + 1;

      const displayEnd =
        Math.min(
          endIndex,
          filteredRows.length
        );


      paginationInfo.textContent =
        `Showing ${displayStart}–${displayEnd} of ${filteredRows.length} matching records`;

    }


    // ======================================================
    // Table Change
    // ======================================================

    tableSelect.addEventListener(
      "change",
      loadTable
    );


    // ======================================================
    // Refresh
    // ======================================================

    refreshBtn.addEventListener(
      "click",
      loadTable
    );


    // ======================================================
    // Add Staff
    // ======================================================

    addStaffBtn.addEventListener(
      "click",
      async function () {

        const name =
          document.getElementById(
            "staffName"
          ).value.trim();

        const phone =
          document.getElementById(
            "staffPhone"
          ).value.trim();

        const designation =
          document.getElementById(
            "staffDesignation"
          ).value.trim();

        const zone =
          document.getElementById(
            "staffZone"
          ).value.trim();


        staffMessage.innerHTML = "";


        if (!name) {

          staffMessage.innerHTML = `
            <div
              class="form-error"
              style="display:block;"
            >
              Please enter staff name.
            </div>
          `;

          return;

        }


        try {

          addStaffBtn.disabled = true;

          addStaffBtn.textContent =
            "Adding...";


          await apiRequest(
            "/admin/staff",
            {
              method: "POST",

              body: {
                name,
                phone,
                designation,
                zone
              }
            }
          );


          staffMessage.innerHTML = `
            <div
              class="form-success"
              style="display:block;"
            >
              Staff member added successfully.
            </div>
          `;


          document.getElementById(
            "staffName"
          ).value = "";

          document.getElementById(
            "staffPhone"
          ).value = "";

          document.getElementById(
            "staffDesignation"
          ).value = "";

          document.getElementById(
            "staffZone"
          ).value = "";


          await loadTable();


          setTimeout(
            function () {

              staffMessage.innerHTML = "";

            },
            3000
          );


        } catch (err) {

          staffMessage.innerHTML = `
            <div
              class="form-error"
              style="display:block;"
            >
              ${escapeHtml(
                err.message ||
                "Could not add staff."
              )}
            </div>
          `;

        } finally {

          addStaffBtn.disabled = false;

          addStaffBtn.textContent =
            "Add Staff";

        }

      }
    );


    // ======================================================
    // Cancel Add Staff
    // ======================================================

    cancelStaffBtn.addEventListener(
      "click",
      function () {

        document.getElementById(
          "staffName"
        ).value = "";

        document.getElementById(
          "staffPhone"
        ).value = "";

        document.getElementById(
          "staffDesignation"
        ).value = "";

        document.getElementById(
          "staffZone"
        ).value = "";

        staffMessage.innerHTML = "";

        addStaffBox.style.display =
          "none";

        tableSelect.value = "users";

        loadTable();

      }
    );


    // ======================================================
    // Initial Load
    // ======================================================

    loadTable();

  </script>

</body>
