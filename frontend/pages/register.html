<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — AquaTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/index.html"><span class="drop"></span> AquaTrack</a>
  <nav><a href="/pages/login.html">Already have an account? Log in</a></nav>
</header>

<div class="shell-narrow">
  <div class="card auth-card">
    <div class="auth-logo"><span class="drop"></span></div>
    <h2 class="auth-title text-center">Create your citizen account</h2>
    <p class="auth-sub">Register to report and track water-related complaints in your area.</p>

    <div class="form-error" id="errBox"></div>
    <div class="form-success" id="okBox"></div>

    <form id="registerForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="e.g. Anita Sharma">
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById("registerForm");
  const errBox = document.getElementById("errBox");
  const okBox = document.getElementById("okBox");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    okBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    try {
      await apiRequest("/auth/register", {
        method: "POST",
        body: {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          password: document.getElementById("password").value,
        },
      });
      okBox.textContent = "Account created successfully. Redirecting to login…";
      okBox.style.display = "block";
      setTimeout(() => (window.location.href = "/pages/login.html"), 1200);
    } catch (err) {
      errBox.textContent = err.message;
      errBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
